<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Multi-Agent Research Assistant</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #0f0f0f;
            color: #eee;
        }

        h1 {
            font-size: 22px;
        }

        #query {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #eee;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            background: #4f8cff;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #timeline {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step {
            padding: 8px 12px;
            border-radius: 6px;
            background: #1a1a1a;
            border-left: 3px solid #444;
            font-size: 14px;
        }

        .step.done {
            border-left-color: #4caf50;
        }

        #report {
            margin-top: 25px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.5;
            display: none;
        }
    </style>
</head>

<body>

    <h1>🔎 Multi-Agent Research Assistant</h1>

    <input type="text" id="query" placeholder="Ask a research question..." />
    <button id="runBtn" onclick="runAgent()">Run</button>

    <div id="timeline"></div>
    <div id="report"></div>

    <script>
        // Backend URL — change this when you deploy
        const API_URL = "http://localhost:8000";

        // Friendly labels for each agent step
        const STEP_LABELS = {
            searcher: "🔍 Searching the web...",
            summarizer: "📝 Summarizing findings...",
            verifier: "✅ Verifying facts...",
            writer: "✍️ Writing final report...",
            final: "🎉 Done!"
        };

        function runAgent() {
            const query = document.getElementById("query").value.trim();
            if (!query) return;

            const btn = document.getElementById("runBtn");
            const timeline = document.getElementById("timeline");
            const reportBox = document.getElementById("report");

            // Reset UI for a fresh run
            timeline.innerHTML = "";
            reportBox.style.display = "none";
            reportBox.textContent = "";
            btn.disabled = true;
            btn.textContent = "Running...";

            // EventSource = browser's built-in SSE client
            const url = `${API_URL}/run-agent?query=${encodeURIComponent(query)}`;
            const eventSource = new EventSource(url);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.node === "final") {
                    // Final report received — show it and close the stream
                    reportBox.style.display = "block";
                    reportBox.textContent = data.report;
                    eventSource.close();
                    btn.disabled = false;
                    btn.textContent = "Run";
                } else {
                    // Intermediate step — add to timeline
                    const div = document.createElement("div");
                    div.className = "step done";
                    div.textContent = STEP_LABELS[data.node] || data.node;
                    timeline.appendChild(div);
                }
            };

            eventSource.onerror = () => {
                // Connection issue or stream ended unexpectedly
                console.error("SSE connection error");
                eventSource.close();
                btn.disabled = false;
                btn.textContent = "Run";
            };
        }
    </script>

</body>

</html>
